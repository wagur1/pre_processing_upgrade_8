# =============================================================================
# H3: STE calibration for the E4-config BIG-POST — the one lever E4 never had.
#
# E4 trained purely through the PROXY codec (no STE). Every smaller config
# that added x265-in-loop STE gained ~+1.3pp on that codec (STE-sandwich:
# -2.05 -> -3.56 h265). E4's weakest axis is h264 (-5.71 vs v9-b's -5.89),
# so H3 alternates BOTH codecs in the loop.
#
# Warm start: E4's own best checkpoint (post_base=64, 2.3M POST).
# 800 steps, lr 2e-5 (half of earlier STE runs — protect the 2.3M POST's
# learned state; E3's lesson was that heavier co-adaptation homogenizes).
# =============================================================================

device: auto
out_dir: outputs/e4_ste
seed: 0

task:
  name: action_recognition
  clip_size: 112
  teachers: [r3d_18, mc3_18]
  teacher_sampling: sample
  backbone: r3d_18

model:
  arch: sandwich
  s_ch: 16
  editor_ch: 24
  cond_dim: 1
  dino_weight: 0.5
  dino_name: dinov2_vits14
  motion_tau: 0.1
  gate: false
  post_base: 64           # E4's big POST

codec:
  kind: ste
  ste_codec: h265
  ste_alternate: true     # both codecs in the loop (h264 is E4's weak axis)
  qualities: [1, 2, 3, 5, 8]
  block: 8
  inter: true
  colorspace: yuv420
  chroma_step_scale: 2.0
  step_coarse: 0.25
  step_fine: 0.03
  anneal: 1.0

data:
  index: data/index/kinetics_hash_split.json
  num_frames: 16
  frame_size: 128
  temporal_stride: 2

loss:
  lam_task: 1.0
  omega: 0.0
  beta: 0.001
  tau: 0.05
  delta: 0.0
  gamma: 0.0
  kappa: 10.0
  kappa_t: 0.0
  gamma_res: 0.0
  mu: 3.0
  rho: 1.0
  use_task_mask: true

train:
  epochs: 1
  max_steps: 800
  reg_warmup_frac: 0.0
  batch_size: 8
  num_workers: 3
  lr: 2.0e-5
  clip_grad: 1.0
  qp_list: [30, 35, 40, 45, 50]
  qp_to_quality: {30: 8, 35: 5, 40: 3, 45: 2, 50: 1}
  cosine: false
  patience: 0
  min_delta: 1.0e-4
  val_qp_mode: all
  val_max_batches: 5
  resume: false
  finetune: true          # load best ckpt (copied in by init bash), fresh opt

eval:
  split: test
  include_proxy: false
  per_sequence: true
  batch_size: 4
  num_workers: 2
  held_out_backbone: r2plus1d_18
  qp_list: [30, 35, 40, 45, 50]
  preset: medium
